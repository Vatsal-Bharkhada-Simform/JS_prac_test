<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Wars game</title>
    <link rel="stylesheet" href="./styles/style.css">
</head>
<body>
    <main>
        <div class="start-screen">
            <h2 class="head">Star wars</h2>
            <div class="text">Press any key to start</div>
        </div>
        <div class="game-over-screen">
            <h2 class="head">Game over</h2>
            <div class="text score"></div>
            <div class="text">Press any key to start again</div>
        </div>
        <section class="asteroid-area">
            <aside class="info">
                <div>
                    <span>Asteroids destroyed:</span>
                    <span class="destroy-count">0</span>
                </div>
                <div>
                    <span>Life:</span>
                    <span class="life-count">❤️❤️❤️</span>
                </div>
            </aside>
        </section>
        <section class="danger-zone">
            <div class="rocket">
                <img src="./assets/images/pngwing.com (2).png" alt="Rocket">
            </div>
        </section>
    </main>
    
    <script type="module" src="./dist/index.js"></script>
</body>
</html>
